<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function () {
  var pdfUrl = "{{ '/files/Oleniuk_Patryk_Software_Eng_Resume.pdf' | relative_url }}";
  var container = document.getElementById("resume-pages");
  var fallback = document.getElementById("resume-fallback");
  if (!window.pdfjsLib || !container) {
    if (fallback) fallback.hidden = false;
    return;
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

  function renderPage(pdf, pageNum, width) {
    return pdf.getPage(pageNum).then(function (page) {
      var unscaled = page.getViewport({ scale: 1 });
      var scale = width / unscaled.width;
      var viewport = page.getViewport({ scale: scale });
      var canvas = document.createElement("canvas");
      var context = canvas.getContext("2d");
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      container.appendChild(canvas);
      return page.render({ canvasContext: context, viewport: viewport }).promise;
    });
  }

  pdfjsLib.getDocument(pdfUrl).promise.then(function (pdf) {
    var width = Math.min(container.clientWidth - 32, 900) * (window.devicePixelRatio || 1);
    var chain = Promise.resolve();
    for (var i = 1; i <= pdf.numPages; i++) {
      (function (pageNum) {
        chain = chain.then(function () { return renderPage(pdf, pageNum, width); });
      })(i);
    }
    return chain;
  }).catch(function () {
    if (fallback) fallback.hidden = false;
  });
})();
</script>
