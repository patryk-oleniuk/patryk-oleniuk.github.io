---
layout: archive
title: "Education & Employment Timeline"
permalink: /employment/
author_profile: true
---

{% include base_path %}

<style>
.emp-timeline {
  position: relative;
  display: flex;
  align-items: stretch;
  width: 100%;
}
.emp-graph {
  flex: 0 0 96px;
  width: 96px;
  overflow: visible;
}
.emp-entries {
  flex: 1 1 auto;
  min-width: 0;
  background: var(--global-bg-color, #fff);
}
.emp-row .list__item {
  display: block !important;
  overflow: visible !important;
  height: auto !important;
  padding-bottom: 1.25rem;
  margin-bottom: 0.5rem;
}
@media (max-width: 640px) {
  .emp-graph { flex-basis: 72px; width: 72px; }
}
</style>

<div class="emp-timeline">
  <svg class="emp-graph" id="emp-graph" aria-hidden="true"></svg>
  <div class="emp-entries" id="emp-entries">
    {% for post in site.employment reversed %}
      <div class="emp-row" data-permalink="{{ post.permalink }}">
        {% include archive-single-timeline.html %}
      </div>
    {% endfor %}
  </div>
</div>

<script src="{{ '/assets/js/employment-graph.js' | relative_url }}"></script>
